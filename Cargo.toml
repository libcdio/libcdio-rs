[package]
name = "libcdio-rs"
version = "0.1.0"
authors = ["Shiva Kiran Koninty <shiva@skran.xyz>"]
edition = "2024"
description = "Safe wrapper and Rust port of GNU libcdio."
repository = "https://github.com/libcdio/libcdio-rs"
license = "GPL-3.0-or-later"
keywords = ["cd", "scsi", "iso9660", "udf"]
categories = ["api-bindings", "multimedia::audio", "filesystem", "hardware-support"]

[features]
iso9660 = ["libcdio-sys/iso9660", "dep:file-mode", "dep:time"]
mmc = ["dep:winnow"]
udf = ["libcdio-sys/udf", "dep:file-mode", "dep:time"]

[dependencies]
bitflags = "2.11.1"
displaydoc = "0.2.6"
docsplay = "0.1.3"
file-mode = { version = "0.1.2", optional = true }
libcdio-sys = { version = "3.0.0", default-features = false }
num_enum = { version = "0.7.6", features = ["complex-expressions"] }
thiserror = "2.0.18"
time = { version = "0.3.55", features = ["local-offset"], optional = true }
tracing = "0.1.44"
winnow = { version = "1.0.3", features = ["binary", "parser", "std"], default-features = false, optional = true }

[dev-dependencies]
test-log = "0.2.21"
time = { version = "0.3.55", features = ["macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
